# POS Framework Configuration
# Auto-generated from 15s recon scan
# Target: auto (auto-select)
#
# Usage: sudo python3 -m posframework full -c posframework.yaml

general:
  interface: wlp2s0mon
  ap_interface: wlan1
  channels: all
  output_dir: exports
target:
  bssid: null
  ssid: null
  channel: null
  auto_select: true
recon:
  timeout: 30
  rssi_limit: -80
attack:
  deauth_burst: 5
  beacon_interval: 0.1
  ap_mode: bridge
  enable_karma: true
  enable_krack: false
  enable_dos: false
  dos_mode: cts_flood
  enable_printers: false
  enable_ap_clone: true
  enable_client_isolation: false
  test_creds: true
plugins:
  enabled: []
  plugins_dir: null
